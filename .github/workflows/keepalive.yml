name: Public demo health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo health endpoint
        env:
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
        run: |
          if [ -z "$DEMO_BASE_URL" ]; then
            echo "DEMO_BASE_URL is not configured in repository variables (Settings > Secrets and variables > Actions > Variables). Skipping health check."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$DEMO_BASE_URL/up"